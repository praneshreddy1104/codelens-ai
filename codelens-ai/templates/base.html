<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CodeLens AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="floats" id="floats"></div>
<div class="shell">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark">&lt;/&gt;</div>
      <div class="brand">CodeLens<span style="color:var(--p2)"> AI</span></div>
    </div>
    <nav class="nav">
      <a href="{{ url_for('home') }}" class="{{ 'active' if active=='home' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
        Home</a>
      <a href="{{ url_for('analyze_page') }}" class="{{ 'active' if active=='analyze' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Analyze Code</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active=='dashboard' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Dashboard</a>
      <a href="{{ url_for('dataset_page') }}" class="{{ 'active' if active=='dataset' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        Dataset</a>
      <a href="{{ url_for('profile') }}" class="{{ 'active' if active=='profile' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile</a>
      <a href="{{ url_for('logout') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout</a>
    </nav>
    <div style="position:absolute;bottom:22px;left:16px;right:16px" class="smallnote">
      <div class="chip" style="width:100%;justify-content:center"><span class="dot"></span> ML engine online</div>
      <div style="text-align:center;margin-top:10px;font-size:11px">Gries S·T·E model · seed 2023</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="hi">Welcome back, <b>{{ user.username }}</b> 👋</div>
      <div class="chip">CodeLens AI · Logic Error Detection</div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
<script>
// floating code symbols
const syms=["while","if","for","def","return","==","+=","print()","AST","S{","T{","E{","i<=n","=>","&&","lambda","{}","[]","import"];
const fl=document.getElementById("floats");
for(let i=0;i<22;i++){const s=document.createElement("span");
 s.textContent=syms[Math.floor(Math.random()*syms.length)];
 s.style.left=Math.random()*100+"vw";
 s.style.fontSize=(14+Math.random()*22)+"px";
 s.style.animationDuration=(11+Math.random()*16)+"s";
 s.style.animationDelay=(-Math.random()*20)+"s";
 fl.appendChild(s);}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;
 document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
